name: usv

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: usv
      POSTGRES_PASSWORD: usv
      POSTGRES_DB: unified_shipping
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usv -d unified_shipping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://usv:usv@postgres:5432/unified_shipping?schema=public
      REDIS_URL: redis://redis:6379/0
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://usv:usv@postgres:5432/unified_shipping?schema=public
      REDIS_URL: redis://redis:6379/0

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
    depends_on:
      - api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://usv:usv@postgres:5432/unified_shipping?schema=public
    ports:
      - "3001:3001"

volumes:
  postgres-data:
  redis-data:
