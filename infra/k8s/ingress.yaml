apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: usv
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 4m
spec:
  ingressClassName: nginx
  rules:
    - host: api.usv.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 80 }
  tls:
    - hosts: [api.usv.example.com]
      secretName: usv-api-tls
